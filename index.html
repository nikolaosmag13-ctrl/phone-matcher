  </main>

    // Εγγραφή Service Worker για PWA

    // Πλήρης Βάση Δεδομένων Κινητών Xiaomi (Xiaomi, Poco, Redmi τελευταίων 3 ετών)

      },

      {
        name: "Redmi 13C / 14C",

      },
      {

      }
    ];

    // Δημιουργία Sliders στο DOM
    const slidersContainer = document.getElementById("slidersContainer");

    FEATURES.forEach(feature => {
      const wrapper = document.createElement("div");
      wrapper.className = "space-y-1 bg-slate-700/40 p-2.5 rounded-xl border border-slate-700/50";
      wrapper.innerHTML = `
        <div class="flex justify-between items-center text-xs">
          <label for="${feature.id}" class="font-medium text-slate-200">${feature.name}</label>
          <span id="${feature.id}_val" class="font-bold text-blue-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-600">5</span>
        </div>
        <p class="text-[10px] text-slate-400">${feature.desc}</p>
        <input type="range" id="${feature.id}" min="1" max="10" value="5" class="w-full h-1.5 bg-slate-600 rounded-lg cursor-pointer">
      `;
      slidersContainer.appendChild(wrapper);

      const slider = wrapper.querySelector(`#${feature.id}`);
      const valBadge = wrapper.querySelector(`#${feature.id}_val`);
      slider.addEventListener("input", () => {
        valBadge.textContent = slider.value;
      });
    });

    // Αλγόριθμος Υπολογισμού Συμβατότητας (Weighted Euclidean Distance)
    function calculateBestMatches() {
      const userProfile = {};
      FEATURES.forEach(f => {
        userProfile[f.id] = parseInt(document.getElementById(f.id).value);
      });

      const scoredPhones = PHONES.map(phone => {
        let sumSquaredDiffs = 0;

        FEATURES.forEach(f => {
          const userVal = userProfile[f.id];
          const phoneVal = phone.scores[f.id];
          sumSquaredDiffs += Math.pow(userVal - phoneVal, 2);
        });

        const distance = Math.sqrt(sumSquaredDiffs);
        const maxDistance = 28.5; // sqrt(10 * 81)
        const matchPercentage = Math.max(0, Math.round((1 - (distance / maxDistance)) * 100));

        return {
          ...phone,
          matchPercentage: matchPercentage
        };
      });

      scoredPhones.sort((a, b) => b.matchPercentage - a.matchPercentage);
      displayResults(scoredPhones);
    }

    // Εμφάνιση Αποτελεσμάτων στο UI
    function displayResults(matches) {
      const resultsSection = document.getElementById("resultsSection");
      const bestMatchCard = document.getElementById("bestMatchCard");
      const runnerUpsContainer = document.getElementById("runnerUpsContainer");

      resultsSection.classList.remove("hidden");

      const topMatch = matches[0];
      bestMatchCard.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <div>
            <span class="text-[11px] font-bold tracking-wider uppercase text-blue-400 bg-blue-900/60 px-2 py-0.5 rounded-full">Top Επιλογή</span>
            <h3 class="text-xl font-bold text-white mt-1">${topMatch.name}</h3>
            <p class="text-xs text-slate-300 font-medium">${topMatch.brand} • ${topMatch.os}</p>
          </div>
          <div class="text-right">
            <span class="text-2xl font-black text-emerald-400">${topMatch.matchPercentage}%</span>
            <span class="block text-[10px] text-slate-400">Συμβατότητα</span>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-700/60 flex justify-between items-center text-sm">
          <span class="text-slate-300">Εκτιμώμενη Τιμή Αγοράς:</span>
          <span class="font-extrabold text-blue-300 text-base">${topMatch.price}</span>
        </div>
      `;

      runnerUpsContainer.innerHTML = "";
      matches.slice(1, 4).forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center";
        div.innerHTML = `
          <div>
            <div class="font-bold text-sm text-slate-200">#${index + 2} ${item.name}</div>
            <div class="text-xs text-slate-400">${item.price} • ${item.brand}</div>
          </div>
          <div class="text-right">
            <span class="font-bold text-blue-400 text-sm">${item.matchPercentage}%</span>
            <span class="block text-[9px] text-slate-500">Match</span>
          </div>
        `;
        runnerUpsContainer.appendChild(div);
      });

      resultsSection.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById("calculateBtn").addEventListener("click", calculateBestMatches);
  </script>
</body>
</html>
